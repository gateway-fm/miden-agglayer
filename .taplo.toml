# Exclude generated TOML from `taplo fmt --check` (make lint): miden-protocol
# 0.16's build.rs emits miden-project.toml files under target/. vendor/ is the
# temporary byte-faithful miden-client patch — upstream formatting stays as
# released. The local runtime directory also contains generated initialization
# checkpoints with serialized proofs, not source configuration.
exclude = ["target/**", "vendor/**", ".miden-agglayer-data/**"]
