# Genesis configuration (protocol 0.16, node v0.16.0-rc.5).
#
# 0.15 embedded sample bridge/faucet .mac account files generated by the
# 0.15-era node-store build.rs. Those serialized accounts are unreadable by
# the 0.16 account format (AccountPatch), the 0.16 node no longer generates
# them, and our proxy never used them — `--init` deploys its own bridge,
# service, ger-manager and faucet accounts at startup. Genesis is therefore
# minimal: chain parameters only, no pre-built accounts.
#
# The genesis validator set is NOT part of this configuration (rc.3+ rejects it
# here): the hex-encoded public keys are passed to `miden-validator genesis`
# via `--validator.key` flags. The compose bootstrap derives the pubkey of the
# insecure dev signing key at runtime with `miden-validator pubkey
# --signing-key.hex` — mirroring the upstream run-node.sh — so this file stays
# free of derived values. The native MIDEN fee faucet is auto-generated
# by `genesis` (no `native_faucet` section) and its id lands in every block
# header's fee_parameters, which is where the proxy reads it from.

timestamp = 1717344256
version = 1

[fee_parameters]
verification_base_fee = 0
