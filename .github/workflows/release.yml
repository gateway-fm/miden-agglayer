name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Replace Node.js's bundled roots for every action with the patched system store.
env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

# Multi-arch (linux/amd64 + linux/arm64) build. Each arch builds natively on its
# own GitHub-hosted runner (amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm —
# free for this public repo), pushes by digest, then a merge job assembles the
# multi-arch manifest under the `:{version}` tag. Native runners avoid the very
# slow QEMU emulation of the Rust + RocksDB build.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Update runner CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" \
            ge 20260816ubuntu0.24.04.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels only)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: gatewayfm/miden-agglayer

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          # Aikido: always rebuild the `runtime` stage, the one that runs
          # `apt-get update && apt-get upgrade -y`. Its cache key is the
          # instruction text (never changes) plus the debian:trixie-slim
          # digest, so between base-image refreshes the gha cache restores a
          # pre-advisory layer and the release republishes the SAME vulnerable
          # packages. Only this stage is uncached; the Rust build stage — the
          # expensive one — still hits the cache.
          no-cache-filters: runtime
          outputs: type=image,name=gatewayfm/miden-agglayer,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Normalise platform name for artifact
        run: echo "PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Update runner CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" \
            ge 20260816ubuntu0.24.04.1

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: gatewayfm/miden-agglayer
          # `latest=false` is load-bearing — see history below. Docker Hub has
          # tag-immutability enabled, so any *moving* tag (`:latest`,
          # `:{major}.{minor}`) fails on the second release that tries to update
          # it. Only the exact `:{version}` tag is pushed. metadata-action
          # defaults to `flavor: latest=auto`, which auto-appends `:latest` for
          # a semver tag push independent of the `tags:` list; that auto-flavor
          # (not `tags:`) killed v0.2.0–v0.5.0. Disabling the flavor is the fix.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'gatewayfm/miden-agglayer@sha256:%s ' *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect gatewayfm/miden-agglayer:${{ steps.meta.outputs.version }}
