on:
  push:
    branches:
      - master
      - main
  pull_request:
    types:
      - opened
      - synchronize

# CodeQL (actions/missing-workflow-permissions): without this, jobs inherit the
# repository default GITHUB_TOKEN scope, which is far wider than anything here
# needs. Every job in this workflow only reads the checked-out source — it builds,
# lints, tests and inspects Cargo.toml — so read-only contents is sufficient.
# Matches release.yml and e2e-l2l2.yml, which already declare exactly this.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: make install-tools
      - run: make lint
      - run: make build
      - run: cargo check --workspace --features postgres --profile=release
      - run: make test-unit
      - run: make test-scripts

      # SCA scanners report the LGPL arm of SPDX "A OR B" expressions as if it
      # were the only option, and do not exclude target-gated crates that never
      # compile. deny.toml records the actual elections (and why each reported
      # crate is not a problem) so the policy is machine-checked here instead of
      # re-derived by hand every time a scan runs.
      - name: license policy (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses

  # Fails on ANY [patch.crates-io] entry and on a re-vendored miden-agglayer.
  # Every patch this repo ever carried was a stand-in for an upstream fix
  # (miden-agglayer API un-gate -> resolved in protocol rc.6; miden-client
  # submit-retry -> resolved in rust-sdk rc.5, #177), and each one silently
  # outlived its reason once. A new patch must therefore be a reviewed change
  # to this gate, not just a Cargo.toml edit.
  upstream-api-gate:
    name: "upstream API gate (no vendor patches)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fail on any vendor patch
        run: |
          rc=0
          if [ -d vendor ] && [ -n "$(ls -A vendor 2>/dev/null)" ]; then
            echo "::error::vendor/ is not empty — no crate is vendored on this branch; a new vendor needs a reviewed exception in this gate with its upstream tracking issue."
            rc=1
          fi
          patched="$(awk '/^\[patch\.crates-io\]/{f=1;next} /^\[/{f=0} f' Cargo.toml \
                     | sed -e 's/#.*//' -e '/^[[:space:]]*$/d' \
                     | cut -d= -f1 | tr -d ' \t')"
          for crate in $patched; do
            echo "::error::[patch.crates-io] entry for $crate — every past patch was a temporary stand-in for an upstream fix; add a reviewed exception here with the upstream tracking issue, or remove the patch."
            rc=1
          done
          exit $rc
