on:
  push:
    branches:
      - master
      - main
  pull_request:
    types:
      - opened
      - synchronize

# CodeQL (actions/missing-workflow-permissions): without this, jobs inherit the
# repository default GITHUB_TOKEN scope, which is far wider than anything here
# needs. Every job in this workflow only reads the checked-out source — it builds,
# lints, tests and inspects Cargo.toml — so read-only contents is sufficient.
# Matches release.yml and e2e-l2l2.yml, which already declare exactly this.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: make install-tools
      - run: make lint
      - run: make build
      - run: cargo check --workspace --features postgres --profile=release
      - run: make test-unit
      - run: make test-scripts

      # SCA scanners report the LGPL arm of SPDX "A OR B" expressions as if it
      # were the only option, and do not exclude target-gated crates that never
      # compile. deny.toml records the actual elections (and why each reported
      # crate is not a problem) so the policy is machine-checked here instead of
      # re-derived by hand every time a scan runs.
      - name: license policy (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses

  # Blocks on an UNRESOLVED upstream API gap. It does NOT block on every vendor
  # patch: the miden-agglayer one it was written for is RESOLVED (rc.6 restored
  # read_let_num_leaves/is_ger_registered as public API and vendor/ is gone), so
  # a blanket "any [patch.crates-io] fails" rule now only reports a stale fact.
  #
  # EXCEPTION (explicit, reviewed): the miden-client rc.3 vendor patch is
  # permitted. It is a correctness fix, not an API un-gate — rc.3 routes
  # submit_proven_transaction AND submit_proven_batch through call_with_retry,
  # re-sending on ResourceExhausted | Unavailable. Proven-transaction
  # submission is NOT idempotent (it consumes notes): if the node accepts and
  # the response is lost, the silent retry resubmits the same transaction and
  # double-spends. The vendor forces both submit endpoints to a single
  # attempt, keeping transport failures indeterminate; every OTHER endpoint
  # keeps its retries (they are reads). rc.3 (not rc.2) is vendored because it
  # is the release wire-compatible with the miden-node v0.16.0-rc.3 e2e stack
  # (storage-map proofs moved into a PartialSmt field the rc.2 client reads as
  # an empty map, which the data_store then rejects). See the
  # [patch.crates-io] comment in Cargo.toml; remove the patch and the vendor
  # copy when upstream stops retrying submit (with #177), and drop it from the
  # allow-list here.
  upstream-api-gate:
    name: "upstream API gate (miden-client vendor exception active)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fail on an unresolved upstream API gap
        run: |
          rc=0
          if ls -d vendor/miden-agglayer-* >/dev/null 2>&1; then
            echo "::error::miden-agglayer is vendored again — that patch exists only to un-gate"
            echo "::error::read_let_num_leaves/is_ger_registered. Upstream restored them in rc.6;"
            echo "::error::re-vendoring means the API regressed and this must not merge."
            rc=1
          fi
          # Every patched crate must be on the allow-list below.
          patched="$(awk '/^\[patch\.crates-io\]/{f=1;next} /^\[/{f=0} f' Cargo.toml \
                     | sed -e 's/#.*//' -e '/^[[:space:]]*$/d' \
                     | cut -d= -f1 | tr -d '[:space:]')"
          for crate in $patched; do
            case "$crate" in
              miden-client)
                echo "::notice::allowed vendor exception: $crate (rc.3 no-retry submit fix)"
                ;;
              *)
                echo "::error::unreviewed [patch.crates-io] entry: $crate — add it to the allow-list in this gate, with justification, or remove the patch."
                rc=1
                ;;
            esac
          done
          exit $rc
